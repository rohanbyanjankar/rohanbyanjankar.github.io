name: Sync FCGO daily revenue
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: fcgo-daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch and extract FCGO table
        run: python scripts/fetch_fcgo.py --write
      - name: Commit updated FCGO snapshot
        run: |
          git add data/fcgo-latest.json
          if git diff --cached --quiet; then
            echo "FCGO snapshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update automated FCGO revenue snapshot"
          git push
